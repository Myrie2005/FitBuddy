<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy - פתיחת פעילות חדשה</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="logo">🏃‍♂️ FitBuddy</a>
        <div class="nav-right">
            <div class="nav-links">
                <a href="index.html" id="nav-home">בית</a>
                <a href="workouts.html" id="nav-workouts">🔍 חיפוש אימונים</a>
                <a href="create.html" id="nav-create">➕ פעילות חדשה</a>
                <a href="profile.html" id="nav-profile">👤 דשבורד ופרופיל</a>
            </div>
            <div id="user-actions" class="nav-actions">
                <a href="profile.html" class="profile-avatar-btn" id="nav-avatar">מ</a>
                <button class="btn-logout" onclick="logoutUser()">התנתק</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div style="text-align: center; margin-bottom: 25px;">
            <h1 style="font-size: 2rem; color: #1e293b;">פתיחת פעילות חדשה</h1>
            <p style="color: #64748b;">פרסם אימון ומצא פרטנרים תוך דקות</p>
        </div>

        <div class="form-card">
            <form onsubmit="handleCreateWorkout(event)">
                <div class="form-group">
                    <label>שם הפעילות *</label>
                    <input type="text" id="form-title" class="form-control" placeholder="למשל: ריצת ערב קלילה בגן סאקר" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>ענף ספורט *</label>
                        <select id="form-category" class="form-control">
                            <option value="RUNNING">ריצה</option>
                            <option value="STRENGTH">כוח</option>
                            <option value="BASKETBALL">כדורסל</option>
                            <option value="FOOTBALL">כדורגל</option>
                            <option value="TENNIS">טניס</option>
                            <option value="YOGA">יוגה</option>
                            <option value="CYCLING">אופניים</option>
                            <option value="WALKING">הליכה</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>מספר משתתפים מקסימלי *</label>
                        <input type="number" id="form-max-participants" class="form-control" value="14" min="2" max="50" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>מיקום מפגש *</label>
                    <input type="text" id="form-location" class="form-control" placeholder="למשל: בית וגן / גן סאקר, ירושלים" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>תאריך *</label>
                        <input type="date" id="form-date" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>שעה *</label>
                        <input type="time" id="form-time" class="form-control" required>
                    </div>
                </div>

                <button type="button" class="optional-toggle-btn" onclick="toggleOptionalDetails()">
                    <span id="optional-arrow">⌃</span> פרטים נוספים (אופציונלי)
                </button>

                <div id="optional-details-box">
                    <div class="form-group">
                        <label>לינק Waze</label>
                        <input type="url" id="form-waze" class="form-control" placeholder="הדבק לינק Waze">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>רמת משחק</label>
                            <select id="form-level" class="form-control">
                                <option value="ALL">לכולם</option>
                                <option value="BEGINNER">מתחילים</option>
                                <option value="INTERMEDIATE">בינוני</option>
                                <option value="ADVANCED">מתקדמים</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>עלות השתתפות</label>
                            <input type="number" id="form-cost" class="form-control" placeholder="חינם" min="0">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>הערות נוספות</label>
                        <textarea id="form-notes" class="form-control" rows="3" placeholder="מידע נוסף למשתתפים..."></textarea>
                    </div>
                </div>

                <button type="submit" id="submit-workout-btn" class="btn-submit">פרסם פעילות</button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/store.js"></script>
    <script>
        async function initializeCreatePage() {
            const form = document.querySelector('.form-card');
            form.style.display = 'none';

            if (await guardTrainerPage()) {
                initNavbar('create');
                form.style.display = '';
            }
        }

        initializeCreatePage();

        function toggleOptionalDetails() {
            const box = document.getElementById('optional-details-box');
            const arrow = document.getElementById('optional-arrow');
            const isHidden = box.style.display === 'none';
            box.style.display = isHidden ? 'block' : 'none';
            arrow.textContent = isHidden ? '⌃' : '⌄';
        }

        async function handleCreateWorkout(e) {
            e.preventDefault();

            if (!(await guardTrainerPage())) {
                return;
            }

            const dateVal = document.getElementById('form-date').value;
            const timeVal = document.getElementById('form-time').value;
            const startDate = new Date(`${dateVal}T${timeVal}`);

            if (Number.isNaN(startDate.getTime())) {
                alert('יש לבחור תאריך ושעה תקינים.');
                return;
            }

            const payload = {
                title: document.getElementById('form-title').value.trim(),
                category: document.getElementById('form-category').value,
                level: document.getElementById('form-level').value,
                location: document.getElementById('form-location').value.trim(),
                startTime: startDate.toISOString(),
                maxParticipants: Number(document.getElementById('form-max-participants').value) || 14,
                cost: Number(document.getElementById('form-cost').value) || 0
            };

            const wazeVal = document.getElementById('form-waze').value.trim();
            if (wazeVal) {
                payload.wazeUrl = wazeVal;
            }

            const notesVal = document.getElementById('form-notes').value.trim();
            if (notesVal) {
                payload.description = notesVal;
            }

            const submitBtn = document.getElementById('submit-workout-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'מפרסם פעילות...';

            try {
                await apiFetch('/api/workouts', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                window.location.href = 'profile.html';
            } catch (error) {
                alert(error.message || 'שגיאה בפרסום הפעילות. בדקי שכל השדות תקינים ושהתאריך עתידי.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'פרסם פעילות';
            }
        }
    </script>
</body>

</html>
