<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy - מצא שותף לאימון</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rubik', sans-serif;
        }

        body {
            background-color: #f4f7fe;
            color: #2b2d42;
            direction: rtl;
        }

        .navbar {
            background: #ffffff;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 700;
            color: #4361ee;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-links button {
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: 500;
            color: #4a5568;
            margin-right: 20px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-links button:hover {
            color: #4361ee;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .hero {
            text-align: center;
            margin-bottom: 30px;
        }

        .hero h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 1.1rem;
            color: #718096;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(67, 97, 238, 0.25);
        }

        .btn-primary {
            background: linear-gradient(135deg, #4361ee, #3f37c9);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #4cc9f0, #4895ef);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .filter-input,
        .filter-select {
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            font-size: 1rem;
            outline: none;
            background: white;
        }

        .filter-input {
            flex: 1;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #2d3748;
        }

        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            border: 1px solid #edf2f7;
        }

        .card-tag {
            background: #eef2ff;
            color: #4361ee;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .card-details {
            color: #718096;
            font-size: 0.95rem;
            display: flex;
            gap: 15px;
        }

        .btn-join {
            background: #2ecc71;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            max-width: 650px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #2d3748;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            font-size: 1rem;
            outline: none;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 14px rgba(46, 204, 113, 0.3);
        }

        .page-section {
            display: none;
        }

        .page-section.active {
            display: block;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">🏃‍♂️ FitBuddy</div>
        <div class="nav-links">
            <button onclick="window.location.href='index.html'">דף הבית</button>
<button onclick="window.location.href='index.html'">אימונים בסביבה</button>
<button onclick="window.location.href='index.html'">פתיחת אימון</button>
        </div>
    </nav>
    <main class="profile-container"
        style="display: flex; gap: 20px; padding: 40px; max-width: 1000px; margin: 0 auto; direction: rtl;">

        <!-- אזור הפרטים האישיים -->
        <section class="user-info"
            style="flex: 1; padding: 20px; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
            <div style="font-size: 60px; text-align: center;">👤</div>
            <h2 style="text-align: center; margin-bottom: 5px;">שרה</h2>
            <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 15px 0;">
            <p><strong>📍 אזור אימונים:</strong> ירושלים והסביבה</p>
            <p><strong>💪 רמת כושר:</strong> מתקדמת</p>
            <p><strong>🏃‍♀️ ספורט מועדף:</strong> הליכה מהירה</p>
        </section>

        <!-- אזור המפה -->
        <section class="map-section"
            style="flex: 2; padding: 20px; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
            <h3 style="margin-top: 0;">מיקומי האימונים שלי</h3>
            <!-- הריבוע האפור הזה יוחלף בהמשך במפה אמיתית של גוגל -->
            <div id="map"
                style="width: 100%; height: 350px; background-color: #f1f5f9; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #64748b;">
                המפה של Google תופיע כאן בשלב הבא...
            </div>
        </section>

    </main>
    <!-- סקריפט המפה -->
    <script>
        function initMap() {
            const jerusalem = { lat: 31.7683, lng: 35.2137 };
            const map = new google.maps.Map(document.getElementById("map"), {
                zoom: 13,
                center: jerusalem,
            });
            const marker = new google.maps.Marker({
                position: jerusalem,
                map: map,
                title: "אימון הליכה מהירה"
            });
        }
    </script>
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY_HERE&callback=initMap"></script>
    </script>
</body>

</html>
